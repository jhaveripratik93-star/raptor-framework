# Service fronting the raptor-gate serving pods.
# ClusterIP is enough: the CI/CD pipeline calls it in-cluster, or you reach it
# from the VDI via `kubectl port-forward svc/raptor-gate 8080:80`.
apiVersion: v1
kind: Service
metadata:
  name: raptor-gate
  namespace: robot-poc
  labels:
    app: raptor-gate
spec:
  type: ClusterIP
  selector:
    app: raptor-gate
  ports:
    - name: http
      port: 80
      targetPort: http
