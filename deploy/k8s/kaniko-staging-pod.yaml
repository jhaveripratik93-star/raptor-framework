# Staging pod — mounts the build-context PVC so we can `kubectl cp` the repo
# into it. Kaniko's own image has no shell/cp tools worth relying on for
# staging, so we use a plain busybox pod as the copy target, then let Kaniko
# mount the same PVC read-only as --context.
apiVersion: v1
kind: Pod
metadata:
  name: raptor-build-stage
  namespace: robot-poc
  labels:
    app: raptor-build-stage
spec:
  restartPolicy: Never
  containers:
    - name: stage
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: ctx
          mountPath: /workspace
  volumes:
    - name: ctx
      persistentVolumeClaim:
        claimName: raptor-build-ctx
